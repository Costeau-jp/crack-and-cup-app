<!doctype html>
<html lang="en-PH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crack &amp; Cup POS</title>
  <meta name="description" content="Point of sale for Crack &amp; Cup — Rage Room &amp; Coffee Shop">
  <meta name="theme-color" content="#C9C9C6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/Anton.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/PermanentMarker.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.min.css">
</head>
<body>
  <!-- Concrete texture: two fractal-noise layers + grain, behind everything. -->
  <svg class="texture" aria-hidden="true" focusable="false" preserveAspectRatio="none">
    <filter id="concrete" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="5" seed="7" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" seed="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <rect class="texture-concrete" width="100%" height="100%" filter="url(#concrete)"/>
    <rect class="texture-grain" width="100%" height="100%" filter="url(#grain)"/>
  </svg>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" aria-live="off">
    <noscript>Crack &amp; Cup POS needs JavaScript.</noscript>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="print-area" aria-hidden="true"></div>
  <script type="module" src="app.min.js"></script>
</body>
</html>
